---
title: "Beth's Snake Game"
layout: "raw"
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beth's Snake 🐍</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #fff;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: #ff69b4;
      text-shadow: 0 0 20px #ff69b4;
    }

    #score-display {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #aaa;
      letter-spacing: 2px;
    }

    #game-wrapper {
      position: relative;
    }

    canvas {
      display: block;
      border: 2px solid #ff69b4;
      box-shadow: 0 0 30px rgba(255,105,180,0.4);
      border-radius: 4px;
      background: #111;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.82);
      border-radius: 4px;
      gap: 1rem;
    }

    #overlay h2 {
      font-size: 2rem;
      color: #ff69b4;
    }

    #overlay p {
      color: #ccc;
      font-size: 1rem;
    }

    #overlay button {
      margin-top: 0.5rem;
      padding: 0.6rem 2rem;
      background: #ff69b4;
      color: #000;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
    }

    #overlay button:hover { transform: scale(1.05); }

    #controls {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>🐍 Beth's Snake 🐍</h1>
<div id="score-display">SCORE: <span id="score">0</span> &nbsp;|&nbsp; BEST: <span id="best">0</span></div>

<div id="game-wrapper">
  <canvas id="gameCanvas" width="480" height="480"></canvas>
  <div id="overlay">
    <h2 id="overlay-title">Beth's Snake</h2>
    <p id="overlay-msg">Use arrow keys or WASD to move</p>
    <button id="overlay-btn" onclick="startGame()">▶ Play</button>
  </div>
</div>

<div id="controls">Arrow keys / WASD &nbsp;|&nbsp; Mobile: swipe</div>

<script>
  const GRID = 20;           // cells
  const CELL = 480 / GRID;  // px per cell = 24

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg = document.getElementById('overlay-msg');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  let snake, dir, nextDir, food, score, best = 0, gameLoop, bethImg, bethLoaded = false;

  // Load Beth's face image
  bethImg = new Image();
  bethImg.onload = () => { bethLoaded = true; };
  bethImg.src = '/images/beth.png';

  // Food colours cycling
  const foodColors = ['#ff69b4','#ff4500','#ffd700','#00ffcc','#a855f7'];
  let foodColorIdx = 0;

  function randomCell() {
    return Math.floor(Math.random() * GRID);
  }

  function placeFood(snakeCells) {
    let pos;
    do {
      pos = { x: randomCell(), y: randomCell() };
    } while (snakeCells.some(s => s.x === pos.x && s.y === pos.y));
    return pos;
  }

  function startGame() {
    overlay.style.display = 'none';
    snake = [
      { x: 10, y: 10 },
      { x: 9,  y: 10 },
      { x: 8,  y: 10 },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    scoreEl.textContent = 0;
    food = placeFood(snake);
    foodColorIdx = 0;
    clearInterval(gameLoop);
    gameLoop = setInterval(tick, 120);
  }

  function tick() {
    dir = nextDir;

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Wall collision
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      return endGame();
    }
    // Self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; }
      foodColorIdx = (foodColorIdx + 1) % foodColors.length;
      food = placeFood(snake);
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Grid dots
    ctx.fillStyle = '#1a1a1a';
    for (let x = 0; x < GRID; x++) {
      for (let y = 0; y < GRID; y++) {
        ctx.fillRect(x * CELL + CELL/2 - 1, y * CELL + CELL/2 - 1, 2, 2);
      }
    }

    // Food — glowing circle
    const fc = foodColors[foodColorIdx];
    ctx.shadowColor = fc;
    ctx.shadowBlur = 15;
    ctx.fillStyle = fc;
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Snake body (all segments except head)
    for (let i = 1; i < snake.length; i++) {
      const seg = snake[i];
      const alpha = 1 - (i / snake.length) * 0.5;
      ctx.fillStyle = `rgba(255, 105, 180, ${alpha})`;
      ctx.beginPath();
      ctx.roundRect(seg.x * CELL + 2, seg.y * CELL + 2, CELL - 4, CELL - 4, 5);
      ctx.fill();
    }

    // Snake head — Beth's face
    const head = snake[0];
    const hx = head.x * CELL;
    const hy = head.y * CELL;

    ctx.save();
    // Rotate head to face direction
    const angle = Math.atan2(dir.y, dir.x);
    ctx.translate(hx + CELL/2, hy + CELL/2);
    ctx.rotate(angle);

    if (bethLoaded) {
      // Clip to circle
      ctx.beginPath();
      ctx.arc(0, 0, CELL/2 - 1, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(bethImg, -CELL/2, -CELL/2, CELL, CELL);
    } else {
      // Fallback
      ctx.fillStyle = '#ff69b4';
      ctx.beginPath();
      ctx.arc(0, 0, CELL/2 - 1, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function endGame() {
    clearInterval(gameLoop);
    overlayTitle.textContent = '💀 Game Over!';
    overlayMsg.textContent = `Score: ${score}`;
    document.getElementById('overlay-btn').textContent = '↩ Try Again';
    overlay.style.display = 'flex';
  }

  // Keyboard controls
  document.addEventListener('keydown', e => {
    const map = {
      ArrowUp:    { x: 0, y: -1 }, w: { x: 0, y: -1 },
      ArrowDown:  { x: 0, y:  1 }, s: { x: 0, y:  1 },
      ArrowLeft:  { x: -1, y: 0 }, a: { x: -1, y: 0 },
      ArrowRight: { x:  1, y: 0 }, d: { x:  1, y: 0 },
    };
    const newDir = map[e.key];
    if (!newDir) return;
    // Prevent reversing
    if (newDir.x === -dir.x && newDir.y === -dir.y) return;
    nextDir = newDir;
    e.preventDefault();
  });

  // Touch/swipe controls
  let touchStart = null;
  canvas.addEventListener('touchstart', e => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      const newDir = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
      if (newDir.x !== -dir.x) nextDir = newDir;
    } else {
      const newDir = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
      if (newDir.y !== -dir.y) nextDir = newDir;
    }
    touchStart = null;
  }, { passive: true });
</script>

</body>
</html>
